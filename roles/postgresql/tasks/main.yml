---
- name: Установка пакетов PostgreSQL
  ansible.builtin.package:
    name:
      - postgresql-server
      - postgresql-contrib
      - python3-psycopg2
    state: present

- name: Инициализация базы данных PostgreSQL
  ansible.builtin.shell: |
    postgresql-setup --initdb
  args:
    creates: /var/lib/pgsql/data/pg_hba.conf
  when: ansible_facts['os_family'] == "RedHat"

- name: Запуск и включение PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Отладка - показать переменные
  ansible.builtin.debug:
    msg:
      - "Пароль PostgreSQL: {{ postgresql_zabbix_password }}"
      - "Версия PostgreSQL: {{ postgresql_version }}"
  when: postgresql_zabbix_password is defined

- name: Настройка pg_hba.conf для аутентификации с паролем
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: /var/lib/pgsql/data/pg_hba.conf
    owner: postgres
    group: postgres
    mode: 0600
  notify: restart postgresql

- name: Настройка postgresql.conf для прослушивания localhost
  ansible.builtin.lineinfile:
    path: /var/lib/pgsql/data/postgresql.conf
    regexp: '^#?listen_addresses'
    line: "listen_addresses = 'localhost'"
  notify: restart postgresql

- name: Создание пользователя zabbix
  community.postgresql.postgresql_user:
    name: zabbix
    password: "{{ postgresql_zabbix_password | default('zabbix_pass') }}"
    role_attr_flags: CREATEDB
  become: yes
  become_user: postgres

- name: Создание пользователя zabbix
  community.postgresql.postgresql_user:
    name: zabbix
    password: "{{ postgresql_zabbix_password | default('zabbix_pass') }}"
    role_attr_flags: CREATEDB
    encrypted: yes
  become: yes
  become_user: postgres

- name: Принудительный сброс пароля пользователя zabbix (гарантия)
  ansible.builtin.shell: |
    sudo -u postgres psql -c "ALTER USER zabbix WITH PASSWORD '{{ postgresql_zabbix_password | default('zabbix_pass') }}';"
  become: yes
  changed_when: false

- name: Создание базы данных zabbix
  community.postgresql.postgresql_db:
    name: zabbix
    owner: zabbix
    encoding: UTF8
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8
  become: yes
  become_user: postgres