---
- name: Установка репозитория Zabbix
  ansible.builtin.shell: |
    rpm -Uvh https://repo.zabbix.com/zabbix/7.0/rhel/9/x86_64/zabbix-release-7.0-1.el9.noarch.rpm
  args:
    creates: /etc/yum.repos.d/zabbix.repo
  register: repo_install
  changed_when: "'already installed' not in repo_install.stdout"
  when: ansible_os_family == "RedHat"

- name: Установка Zabbix Agent
  ansible.builtin.dnf:
    name:
      - zabbix-agent
    state: present
  when: ansible_os_family == "RedHat"

- name: Создание директории для конфигурации
  ansible.builtin.file:
    path: /etc/zabbix
    state: directory
    owner: zabbix
    group: zabbix
    mode: '0755'

- name: Настройка zabbix_agentd.conf
  ansible.builtin.template:
    src: zabbix_agentd.conf.j2
    dest: /etc/zabbix/zabbix_agentd.conf
    owner: zabbix
    group: zabbix
    mode: '0644'
  notify: restart zabbix-agent

- name: Настройка zabbix_agentd.d/include
  ansible.builtin.file:
    path: /etc/zabbix/zabbix_agentd.d
    state: directory
    owner: zabbix
    group: zabbix
    mode: '0755'

- name: Открытие порта 10050 в firewalld
  ansible.builtin.firewalld:
    port: 10050/tcp
    permanent: yes
    state: enabled
    immediate: yes
  when: ansible_os_family == "RedHat"
  notify: reload firewalld

- name: Запуск и включение Zabbix Agent
  ansible.builtin.service:
    name: zabbix-agent
    state: started
    enabled: true

- name: Проверка статуса Zabbix Agent
  ansible.builtin.command: systemctl is-active zabbix-agent
  register: agent_status
  changed_when: false
  ignore_errors: true

- name: Отладка - статус агента
  ansible.builtin.debug:
    msg: "Zabbix Agent на {{ inventory_hostname }}: {{ agent_status.stdout }}"
  when: agent_status.rc == 0