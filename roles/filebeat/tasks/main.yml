---
- name: Обновление Docker Compose до V2
  shell: |
    curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
    chmod +x /usr/local/bin/docker-compose
    /usr/local/bin/docker-compose --version
  register: compose_update
  changed_when: "'version' in compose_update.stdout"
  tags: [filebeat]

- name: Создание директории для конфигурации Filebeat
  file:
    path: /etc/filebeat
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: [filebeat]

- name: Создание директории для логов Filebeat
  file:
    path: /var/log/filebeat
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: [filebeat]

- name: Копирование конфигурации Filebeat
  template:
    src: filebeat.yml.j2
    dest: /etc/filebeat/filebeat.yml
    owner: root
    group: root
    mode: '0644'
  tags: [filebeat]

- name: Запуск Filebeat в Docker
  docker_container:
    name: filebeat
    image: docker.elastic.co/beats/filebeat:8.11.0
    restart_policy: always
    volumes:
      - /etc/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/log/nginx:/var/log/nginx:ro
      - /var/log/filebeat:/var/log/filebeat
    user: root
    command: ["filebeat", "-e", "-strict.perms=false"]
  tags: [filebeat]