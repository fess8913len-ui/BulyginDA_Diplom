---
# Версии ELK
elasticsearch_version: "8.11.0"
kibana_version: "8.11.0"
logstash_version: "8.11.0"

# Параметры Elasticsearch
elasticsearch_heap_size: "1g"
elasticsearch_password: "changeme"  # В production поменять!
elasticsearch_data_dir: "/var/lib/elasticsearch"

# Параметры Kibana
kibana_port: 5601
kibana_host: "0.0.0.0"

# Параметры Logstash
logstash_beats_port: 5044
logstash_syslog_port: 5000
logstash_http_port: 8088

# Параметры безопасности
xpack_security_enabled: true
xpack_https_enabled: false  # Для локальной разработки